<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zorigt — Тоглоом хөгжүүлэгч (Game Developer)</title>
    <meta name="description" content="Zorigt-ийн тоглоом хөгжүүлэгч болох мөрөөдөл, ур чадвар, төлөвлөгөө болон интерактив тоглоом." />
    <meta property="og:title" content="Zorigt — Тоглоом хөгжүүлэгч (Game Developer)" />
    <meta property="og:description" content="Zorigt-ийн тоглоом хөгжүүлэгч болох мөрөөдөл, ур чадвар, төлөвлөгөө болон интерактив тоглоом." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon (exact data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cg transform='rotate(-30 12 12)'%3E%3Ccircle cx='7.3' cy='3.2' r='1.45'/%3E%3Crect x='5.5' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Crect x='14.9' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Ccircle cx='16.7' cy='20.8' r='1.45'/%3E%3C/g%3E%3C/svg%3E" />

    <!-- Google Fonts fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&family=Press+Start+2P&display=swap" rel="stylesheet" />

    <style>
      /* Force black immediately so the page can never flash white */
      html, body, #root {
        background: #000000 !important;
        color: #ffffff;
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
      }

      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("inter.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url("instrument-serif-italic.woff2") format("woff2");
      }

      :root {
        --bg: #000000;
        --text: #ffffff;
        --muted: #9a9a9a;
        --stat: #d8d8d8;
        --border: rgba(255, 255, 255, 0.16);
        --border-soft: rgba(255, 255, 255, 0.12);

        --logo: 15.5px;
        --logo-mark: 22px;
        --nav: 13.5px;
        --nav-h: 38px;
        --btn: 13.5px;
        --btn-h: 38px;
        --hero-btn-h: 42px;
        --h1: 46px;
        --lede: 15px;
        --badge: 12.5px;
        --stat-size: 13px;
        --header-y: 16px;
        --header-x: 24px;
        --stats-x: 24px;
        --stats-y: 28px;
        --hero-gap: 52px;
        --copy-max: 880px;
        --lede-max: 560px;
      }

      * , *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
        position: relative;
        background: #000000;
        color: #ffffff;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font-family: inherit;
      }

      /* Strict sizing locks for icons */
      svg.stat-icon, .stat-icon {
        width: 20px !important;
        height: 20px !important;
        min-width: 20px !important;
        max-width: 20px !important;
        min-height: 20px !important;
        max-height: 20px !important;
        flex-shrink: 0 !important;
        display: inline-block !important;
      }

      svg.stat-icon-wide, .stat-icon-wide {
        width: 38px !important;
        height: 21px !important;
        min-width: 38px !important;
        max-width: 38px !important;
        min-height: 21px !important;
        max-height: 21px !important;
        flex-shrink: 0 !important;
        display: inline-block !important;
      }

      svg.logo-mark, .logo-mark {
        width: 22px !important;
        height: 22px !important;
        min-width: 22px !important;
        max-width: 22px !important;
        flex-shrink: 0 !important;
        display: inline-block !important;
      }

      svg.badge-star, .badge-star {
        width: 18px !important;
        height: 20px !important;
        min-width: 18px !important;
        max-width: 18px !important;
        flex-shrink: 0 !important;
        display: inline-block !important;
      }

      /* Grain texture */
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Hero photo & scrim */
      .hero-photo {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 30%, rgba(40, 40, 50, 0.4) 0%, rgba(10, 10, 15, 0.8) 60%, #000000 100%);
        z-index: 0;
      }

      .hero-photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, transparent 25%, rgba(0, 0, 0, 0.8) 85%, #000000 100%);
        pointer-events: none;
      }

      /* Header */
      header.header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        z-index: 50;
        position: sticky;
        top: 0;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      @media (min-width: 901px) {
        header.header {
          display: grid;
          grid-template-columns: 1fr auto 1fr;
          padding: 16px 36px;
        }
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: var(--logo);
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #ffffff;
      }

      .logo-suffix {
        font-weight: 400;
        color: var(--muted);
      }

      #site-nav {
        display: none;
        align-items: center;
        gap: 8px;
        justify-self: center;
      }

      @media (min-width: 901px) {
        #site-nav {
          display: flex;
        }
      }

      /* Liquid-metal pills */
      #site-nav a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: var(--nav-h);
        padding: 0 16px;
        border-radius: 7px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(198, 198, 198, 0.5);
        background: linear-gradient(105deg, #050505 0%, #2a2a2a 48%, #4a4a4a 100%);
        color: #f3f3f3;
        font-size: var(--nav);
        font-weight: 400;
        letter-spacing: -0.01em;
        white-space: nowrap;
        transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
      }

      #site-nav a::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.16) 50%, transparent 70%);
        transform: translateX(-120%);
        transition: transform 0.6s ease;
        pointer-events: none;
      }

      #site-nav a:hover {
        border-color: rgba(235, 235, 235, 0.9);
        background: linear-gradient(105deg, #111111 0%, #3a3a3a 45%, #6a6a6a 100%);
        box-shadow: 0 0 18px rgba(200, 210, 230, 0.18);
      }

      #site-nav a:hover::before {
        transform: translateX(120%);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-self: end;
      }

      /* Burger */
      .burger {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(18, 18, 22, 0.7);
        z-index: 60;
        gap: 4.5px;
        cursor: pointer;
        padding: 0;
        transition: border-color 0.25s ease, background 0.25s ease;
      }

      @media (min-width: 901px) {
        .burger {
          display: none;
        }
      }

      .burger:hover {
        border-color: rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.1);
      }

      .burger-bar {
        display: block;
        width: 16px;
        height: 1.5px;
        background: #ffffff;
        border-radius: 1px;
        transition: transform 0.25s ease, opacity 0.2s ease;
      }

      body.menu-open .burger-bar:nth-child(1) {
        transform: translateY(6px) rotate(45deg);
      }

      body.menu-open .burger-bar:nth-child(2) {
        opacity: 0;
      }

      body.menu-open .burger-bar:nth-child(3) {
        transform: translateY(-6px) rotate(-45deg);
      }

      /* Mobile menu backdrop */
      .menu-backdrop {
        display: none;
      }

      body.menu-open .menu-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }

      /* Buttons (shared liquid-glass language) */
      .btn {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: var(--btn-h);
        padding: 0 16px;
        border-radius: 6px;
        font-size: var(--btn);
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease, color 0.35s ease;
      }

      .btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.45) 48%, transparent 76%);
        transform: translateX(-130%);
        transition: transform 0.65s ease;
        pointer-events: none;
        z-index: 2;
      }

      .btn:hover::after {
        transform: translateX(130%);
      }

      /* Solid Button */
      .btn-solid {
        background: linear-gradient(180deg, #ffffff 0%, #e7e7e7 48%, #cfcfcf 100%);
        color: #111111;
        border: 1px solid #ffffff;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }

      .btn-solid:hover {
        background: linear-gradient(180deg, #ffffff 0%, #f3f6ff 42%, #d5def2 100%);
        border-color: #f2f6ff;
        box-shadow: inset 0 1px 0 #ffffff, 0 0 20px rgba(186, 208, 255, 0.35);
      }

      /* Ghost Button */
      .btn-ghost {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.45) 50%, rgba(160, 175, 200, 0.08));
        color: #ffffff;
        border: 1px solid rgba(198, 198, 198, 0.45);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      .btn-ghost:hover {
        background: linear-gradient(135deg, rgba(210, 225, 255, 0.18), rgba(0, 0, 0, 0.35) 48%, rgba(180, 195, 220, 0.16));
        border-color: rgba(220, 230, 255, 0.75);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 20px rgba(170, 200, 255, 0.22);
      }

      /* Hero Ghost Button */
      .hero-ghost {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(0, 0, 0, 0.5) 46%, rgba(150, 170, 200, 0.1));
        border: 1px solid rgba(198, 198, 198, 0.55);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .hero-ghost:hover {
        border-color: rgba(220, 230, 255, 0.8);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 24px rgba(170, 200, 255, 0.28);
      }

      /* Badge */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        padding: 8px 14px;
        border: 0;
        border-radius: 5px;
        background: linear-gradient(90deg, #7d7d7d 0%, #2a2a2a 52%, #0a0a0a 100%);
        color: #f2f2f2;
        font-size: var(--badge);
        font-weight: 400;
        letter-spacing: -0.01em;
      }

      /* Headline */
      .headline-line {
        display: block;
        overflow: hidden;
        padding: 0.04em 0.1em;
      }

      h1 em, .vesper-em {
        font-family: "Instrument Serif", "Times New Roman", Times, serif !important;
        font-style: italic;
        font-weight: 400;
        font-size: 1.08em;
        letter-spacing: -0.03em;
        color: #9a9a9a;
        display: inline-block;
      }

      /* Frosted glass cards */
      .vesper-card {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(18, 18, 22, 0.8) 50%, rgba(8, 8, 12, 0.95) 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 18px;
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .vesper-card:hover {
        border-color: rgba(255, 255, 255, 0.22);
      }

      /* Entrance motion */
      .appear {
        opacity: 1;
        animation-duration: 0.9s;
        animation-fill-mode: both;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        animation-delay: var(--d, 0.08s);
      }

      .appear--scale { animation-name: in-scale; }
      .appear--soft { animation-name: in-soft; }
      .appear--mask { animation-name: in-mask; display: inline-block; }
      .appear--pop { animation-name: in-pop; }
      .appear--btn { animation-name: in-btn; }
      .appear--side { animation-name: in-side; }
      .appear--stat { animation-name: in-stat; }

      .is-in {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        clip-path: none !important;
        filter: none !important;
      }

      @keyframes in-scale {
        0% { opacity: 0; transform: scale(0.88); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes in-soft {
        0% { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes in-mask {
        0% { opacity: 0; transform: translateY(35%); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes in-pop {
        0% { opacity: 0; transform: scale(0.92); }
        70% { opacity: 1; transform: scale(1.02); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes in-btn {
        0% { opacity: 0; transform: translateY(16px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes in-side {
        0% { opacity: 0; transform: translateX(18px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes in-stat {
        0% { opacity: 0; transform: translateY(16px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition: none !important;
          animation: none !important;
        }
        .appear, .hero-photo, h1 em, .vesper-em, .badge-star {
          opacity: 1 !important;
          transform: none !important;
          clip-path: none !important;
          filter: none !important;
        }
      }
    </style>
  </head>
  <body style="background:#000;color:#fff">
    <div class="grain"></div>
    <div class="hero-photo"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
